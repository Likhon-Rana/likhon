<!-- personal.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS - Personal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside id="sidebar" class="glass">
        <div style="padding: 10px; margin-bottom: 20px;"><h2 style="color: var(--primary); font-weight: 800;">Life OS</h2></div>
        <nav>
            <a href="index.html" class="nav-item">Overview</a>
            <a href="academic.html" class="nav-item">Academic Hub</a>
            <a href="skills.html" class="nav-item">Skills & Projects</a>
            <a href="health.html" class="nav-item">Fitness & Wellness</a>
            <a href="personal.html" class="nav-item active">Personal & Habits</a>
        </nav>
    </aside>

    <main id="main-content">
        <header class="glass">
            <div><h1 style="color: var(--primary);">Personal & Habits</h1><p style="color: var(--text-muted);">Finance & Lifestyle</p></div>
        </header>

        <div class="grid-container">
            <!-- Finance Tracker -->
            <div class="glass-card">
                <div class="widget-title">Monthly Budget (Target: 7000 BDT)</div>
                
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;">
                    <span>Remaining:</span>
                    <span id="remaining-budget" style="color: var(--primary);">7000 BDT</span>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="number" id="expense-amt" placeholder="Amount (BDT)" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border);">
                    <button class="btn btn-primary" style="width:auto; margin:0;" onclick="addExpense()">Add</button>
                </div>
                <button class="btn btn-outline" onclick="resetBudget()">Reset Month</button>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let spent = parseFloat(localStorage.getItem('monthly_spent')) || 0;
        const totalBudget = 7000;

        function updateBudgetUI() {
            const rem = totalBudget - spent;
            const el = document.getElementById('remaining-budget');
            el.innerText = `${rem} BDT`;
            el.style.color = rem < 1000 ? 'var(--danger)' : 'var(--primary)';
        }

        function addExpense() {
            const amt = parseFloat(document.getElementById('expense-amt').value);
            if(amt && amt > 0) {
                spent += amt;
                localStorage.setItem('monthly_spent', spent);
                document.getElementById('expense-amt').value = '';
                updateBudgetUI();
            }
        }

        function resetBudget() {
            if(confirm('Start a new month?')) {
                spent = 0;
                localStorage.setItem('monthly_spent', 0);
                updateBudgetUI();
            }
        }

        updateBudgetUI();
    </script>
</body>
</html>
