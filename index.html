<!-- index.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside id="sidebar" class="glass">
        <div style="padding: 10px; margin-bottom: 20px;">
            <h2 style="color: var(--primary); font-weight: 800;">Life OS</h2>
        </div>
        <nav>
            <a href="index.html" class="nav-item active">Overview</a>
            <a href="academic.html" class="nav-item">Academic Hub</a>
            <a href="skills.html" class="nav-item">Skills & Projects</a>
            <a href="health.html" class="nav-item">Fitness & Wellness</a>
            <a href="personal.html" class="nav-item">Personal & Habits</a>
        </nav>
    </aside>

    <main id="main-content">
        <header class="glass">
            <div>
                <h1 style="color: var(--primary);">University of Dhaka - EEE</h1>
                <p style="color: var(--text-muted); font-weight: 600;">3rd Year, 2nd Semester</p>
            </div>
            <button id="theme-toggle" class="btn btn-outline" style="width: auto;">Toggle Theme</button>
        </header>

        <div class="grid-container">
            <!-- Clock & Quote -->
            <div class="glass-card col-span-2" style="text-align: center; padding: 40px;">
                <div id="live-clock" style="font-size: 3rem; font-weight: 900; color: var(--primary);">--:--:--</div>
                <div id="live-date" style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 20px;">--</div>
                <p style="font-style: italic; font-weight: 600; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 20px;" id="quote-display"></p>
            </div>

            <!-- CGPA Snapshot -->
            <div class="glass-card">
                <div class="widget-title">Academic Target</div>
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem; margin-bottom: 10px;">
                    <span>Current CGPA:</span> <span style="color: var(--danger);" id="c-cgpa">--</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem;">
                    <span>Target CGPA:</span> <span style="color: var(--primary);" id="t-cgpa">--</span>
                </div>
                <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">Credits Completed: <span id="c-cred"></span></p>
            </div>

            <!-- Quick Links -->
            <div class="glass-card">
                <div class="widget-title">Quick Links</div>
                <div id="links-container"></div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Populate Dashboard Data
        document.getElementById('quote-display').innerText = `"${lifeData.quote}"`;
        document.getElementById('c-cgpa').innerText = lifeData.profile.currentCGPA;
        document.getElementById('t-cgpa').innerText = lifeData.profile.targetCGPA;
        document.getElementById('c-cred').innerText = lifeData.profile.completedCredits;

        const linksContainer = document.getElementById('links-container');
        lifeData.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = "_blank";
            a.className = "btn btn-outline";
            a.innerText = link.name;
            linksContainer.appendChild(a);
        });
    </script>
</body>
</html>
